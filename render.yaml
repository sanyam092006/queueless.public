# Render Blueprint: New > Blueprint > pick this repo. Only MONGO_URI and CLIENT_URL need typing in.
services:
  - type: web
    name: queueless-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true   # Render creates a strong random secret for you
      - key: MONGO_URI
        sync: false           # you paste your Atlas string in the dashboard
      - key: CLIENT_URL
        sync: false           # your Vercel URL, filled in after the frontend deploy
